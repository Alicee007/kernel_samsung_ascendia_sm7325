name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev libssl-dev libelf-dev bc python3 clang lld llvm

    - name: Build kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export LLVM=1
        make vendor/m52xq_swa_ins_defconfig
        make -j$(nproc --all) 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-m52xq
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/dtbo.img

- name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
