name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5-dev libssl-dev libelf-dev bc python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Download Android Clang toolchain
      run: |
        mkdir -p ~/toolchain
        wget -q "https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz" -O ~/toolchain/clang.tar.gz
        tar -xf ~/toolchain/clang.tar.gz -C ~/toolchain/

    - name: Build kernel
      run: |
        export ARCH=arm64
        export PATH=~/toolchain/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export LLVM=1
        make vendor/m52xq_swa_ins_defconfig
        make -j$(nproc --all) CFLAGS_KERNEL="-I$(pwd)" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

    - name: Find output files
      if: always()
      run: |
        echo "=== Procurando arquivos de boot ==="
        find . -name "Image" -o -name "Image.gz" -o -name "dtbo.img" 2>/dev/null || echo "Nenhum arquivo encontrado"

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kernel-m52xq
        path: |
          arch/arm64/boot/Image
          arch/arm64/boot/Image.gz
          arch/arm64/boot/dtbo.img
          build.log
        if-no-files-found: warn
